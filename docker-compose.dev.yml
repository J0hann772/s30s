# Для правок: файлы берутся с диска, пересборка образа не нужна,
# достаточно обновить страницу.
#   docker compose -f docker-compose.dev.yml up -d
# Сайт: http://localhost:8080 (порт открыт только на 127.0.0.1)
services:
  site:
    build: .
    image: s30s:local
    container_name: s30s-dev
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./server/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/nginx-http.conf:/etc/nginx/conf.d/00-limits.conf:ro
      - ./server/nginx-security.conf:/etc/nginx/s30s/nginx-security.conf:ro
    restart: unless-stopped
