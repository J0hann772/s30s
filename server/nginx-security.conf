# Минимальная защита статического сайта s30s (без аккаунтов, без сервера приложений).
# Подключить ВНУТРИ существующего блока server { ... } для s30s.ru (HTTPS уже настроен):
#     include /var/www/cheatsheet/server/nginx-security.conf;
# Затем:  sudo nginx -t && sudo systemctl reload nginx
# Проверка: ./deploy.sh сам убедится, что служебные файлы недоступны.

# Только чтение
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Не отдавать служебное содержимое репозитория (самое важное: .git лежит в /var/www/cheatsheet)
location ~ ^/(\.git|\.idea|\.venv|tools|notes|server|README) { return 404; }
location ~ /\. { return 404; }
location ~* ^/deploy\.(sh|ps1|cmd|conf|conf\.example)$ { return 404; }

autoindex off;

# Заголовки безопасности (CSP дублирует meta в index.html и добавляет frame-ancestors)
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=15552000" always;
