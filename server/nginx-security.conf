# Минимальная защита статического сайта s30s (без аккаунтов, без сервера приложений).
# Подключить ВНУТРИ существующего блока server { ... } для s30s.ru (HTTPS уже настроен):
#     include /var/www/cheatsheet/server/nginx-security.conf;
# Затем:  sudo nginx -t && sudo systemctl reload nginx
# Проверка: ./deploy.sh сам убедится, что служебные файлы недоступны.
# ВАЖНО: зоны лимитов (limit_req_zone) объявлены в server/nginx-http.conf, его нужно подключить в контексте http (см. файл).

# Только чтение
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Не отдавать служебное содержимое репозитория (самое важное: .git лежит в /var/www/cheatsheet)
location ~ ^/(\.git|\.idea|\.venv|tools|notes|materials-src|server|README) { return 404; }
location ~ /\. { return 404; }
location ~* ^/deploy\.(sh|ps1|cmd|conf|conf\.example)$ { return 404; }

autoindex off;

# Заголовки безопасности (CSP дублирует meta в index.html и добавляет frame-ancestors)
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=15552000" always;

# ---- Защита от перегрузки (минимум) ----
# Медленные клиенты не должны держать соединения (защита от slowloris)
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          30s;
keepalive_timeout     15s;
reset_timedout_connection on;
client_max_body_size  1k;                         # сайт статический, тела запросов не нужны
large_client_header_buffers 4 8k;

# Лимит запросов и соединений с одного адреса для всего сайта
limit_req  zone=s30s_page burst=100 nodelay;
limit_conn s30s_conn 40;

# Архивы: редкие запросы, 3 соединения на адрес, после 20 МБ скорость ограничивается; чужим сайтам ссылаться нельзя
location ^~ /materials/_zip/ {
    limit_req  zone=s30s_dl burst=10 nodelay;
    limit_conn s30s_conn 3;
    limit_rate_after 20m;
    limit_rate 3m;
    valid_referers none blocked server_names;     # прямые ссылки (из мессенджера) и свои страницы можно
    if ($invalid_referer) { return 403; }
    expires 1h;
}

# Фото и файлы материалов: кэш в браузере, чтобы повторные просмотры не нагружали сервер
location ^~ /materials/ {
    limit_req  zone=s30s_page burst=200 nodelay;
    expires 7d;
}

# Статика сайта
location ~* \.(js|css|woff2)$ { expires 1h; }
