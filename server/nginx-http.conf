# Лимиты запросов для s30s (контекст http). Подключается один раз:
#     sudo cp /var/www/cheatsheet/server/nginx-http.conf /etc/nginx/conf.d/s30s-limits.conf
#     sudo nginx -t && sudo systemctl reload nginx
# (в Ubuntu/Debian conf.d/*.conf включается в блок http автоматически; если файл изменился после git pull, скопируйте его заново)
#
# Лимиты на IP-адрес. Университетская сеть (NAT) даёт один адрес многим людям, поэтому значения щедрые:
# защита от грубого перегруза и скачивания архивов в цикле, а не от распределённой атаки.
limit_req_zone  $binary_remote_addr zone=s30s_page:10m rate=30r/s;   # страницы, скрипты, миниатюры
limit_req_zone  $binary_remote_addr zone=s30s_dl:10m   rate=20r/m;   # архивы и крупные файлы
limit_conn_zone $binary_remote_addr zone=s30s_conn:10m;              # одновременные соединения
limit_req_status  429;
limit_conn_status 429;
