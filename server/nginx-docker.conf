# Блок server для контейнера. Правила безопасности и лимиты те же,
# что на боевом сервере: server/nginx-security.conf подключается ниже.
# HTTPS здесь не нужен: снаружи контейнер закрывают либо локальный порт,
# либо обратный прокси с сертификатом.
server {
    listen      80;
    # Имена нужны для valid_referers server_names в nginx-security.conf
    # (иначе скачивание архивов со страниц самого сайта давало бы 403).
    # Сам по себе server_name не ограничивает, запросы с любым Host сюда попадут.
    server_name s30s.ru www.s30s.ru localhost;

    # За системным nginx (обратный прокси) настоящий адрес посетителя приходит
    # в X-Real-IP. Доверяем ему только от docker-сетей: иначе лимиты запросов
    # считались бы по одному адресу прокси сразу для всех посетителей.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Real-IP;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # Сжатие: data/*.js весит сотни килобайт
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2 application/manifest+json;

    include /etc/nginx/s30s/nginx-security.conf;

    # index.html и service worker не кэшируем, иначе после обновления
    # сайт останется старым. Именно expires, а не add_header: add_header
    # внутри location отменяет все заголовки безопасности, унаследованные
    # от server, а expires их сохраняет.
    location = /index.html { expires -1; }
    location = /sw.js      { expires -1; }

    location / {
        try_files $uri $uri/ =404;
    }
}
